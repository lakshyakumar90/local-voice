<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108" role="img"><title>Illustrative listening animation; not live microphone input</title><style>.b{transform-box:fill-box;transform-origin:center;animation:listen 1.2s ease-in-out infinite}.b1{animation-delay:-.18s}.b2{animation-delay:-.36s}.b3{animation-delay:-.12s}.b4{animation-delay:-.28s}@keyframes listen{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.b{animation:none}}</style><rect class="b b0" x="14" y="40" width="12" height="28" rx="6" fill="#087F75"/><rect class="b b1" x="32" y="28" width="12" height="52" rx="6" fill="#087F75"/><rect class="b b2" x="50" y="14" width="12" height="80" rx="6" fill="#087F75"/><rect class="b b3" x="68" y="28" width="12" height="52" rx="6" fill="#087F75"/><rect class="b b4" x="86" y="40" width="12" height="28" rx="6" fill="#087F75"/></svg>